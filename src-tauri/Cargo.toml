[package]
name = "havit-ms966wb-battery-monitor"
version = "0.1.0"
description = "Windows battery monitor for the Havit MS966WB wireless mouse"
edition = "2024"
license = "MIT"
autobins = false

[[bin]]
name = "hmbm"
path = "src/main.rs"

[lib]
name = "havit_ms966wb_battery_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
alt-icons-build = { path = "../crates/alt-icons-build" }
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
alt-icons = { path = "../crates/alt-icons" }
hidapi = "2.6.7"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.6", features = ["image-ico", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.5"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_UI_WindowsAndMessaging",
] }
