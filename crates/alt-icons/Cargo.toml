[package]
name = "alt-icons"
description = "A Windows executable that permanently changes its own icon, iOS-style."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
